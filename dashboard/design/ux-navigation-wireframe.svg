  <text x="900" y="592" fill="#93a8b1" font-family="DejaVu Sans, sans-serif" font-size="14">* 7 da definire; debug nel Sistema.</text>
  <text x="900" y="620" fill="#93a8b1" font-family="DejaVu Sans, sans-serif" font-size="14">I tasti reali oggi fanno altro:</text>
