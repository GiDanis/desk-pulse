<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Concept del cronometraggio al centro dell'ovale SmartPC</title>
<desc id="desc">Proposta 960 per 640. Pista invariata larga 12 metri, cinque vetture visibili, tempi personale e ultimo giro, tre delta di settore al centro. Tutti i dati sono illustrativi, nessun software installato da questo concept.</desc>
