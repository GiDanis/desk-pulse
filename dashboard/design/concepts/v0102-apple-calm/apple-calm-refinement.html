#calm-refinement{width:100%}
#calm-refinement .rf-app{--rf-bg:#f3f4f6;--rf-surface:#fff;--rf-text:#1d1d1f;--rf-muted:#5d626c;--rf-line:#cdd2da;--rf-accent:#0066cc;--rf-focus:#e7f0ff;--rf-warn:#8a5200;--rf-scale:1;position:relative;min-height:640px;font-family:RefUI,Cantarell,sans-serif;font-size:24px;line-height:1.2;color:var(--rf-text);background:var(--rf-bg);text-align:left;isolation:isolate}
#calm-refinement .rf-app[data-palette=night]{--rf-bg:#101115;--rf-surface:#202228;--rf-text:#f5f5f7;--rf-muted:#adb2bd;--rf-line:#505662;--rf-accent:#79b8ff;--rf-focus:#293b54;--rf-warn:#e9b766}
#calm-refinement .rf-app *{box-sizing:border-box}
#calm-refinement .rf-header{height:64px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--rf-line);margin:0 24px}
#calm-refinement .rf-topic{font-size:calc(30px * var(--rf-scale));font-weight:600;margin:0}
#calm-refinement .rf-time{font:28px RefNumbers,sans-serif;margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
#calm-refinement .rf-dots{display:flex;gap:10px;position:absolute;left:44%;top:29px}
#calm-refinement .rf-dots b{width:6px;height:6px;border-radius:50%;background:var(--rf-muted);opacity:.5}
#calm-refinement .rf-dots b:first-child{width:9px;height:9px;opacity:1;background:var(--rf-accent)}
#calm-refinement .rf-header svg.lucide{width:28px!important;height:28px!important;color:var(--rf-accent)}
#calm-refinement .rf-main{padding:22px 32px 20px}
#calm-refinement .rf-title{font-size:calc(34px * var(--rf-scale));line-height:1.15;font-weight:600;margin:0 0 10px}
#calm-refinement .rf-sub{font-size:calc(24px * var(--rf-scale));color:var(--rf-muted);margin:0 0 16px}
#calm-refinement .rf-meta{font-size:calc(22px * var(--rf-scale));color:var(--rf-muted);line-height:1.2}
#calm-refinement .rf-heading{display:flex;align-items:start;justify-content:space-between;gap:16px}
#calm-refinement .rf-chip{font-size:22px;color:var(--rf-accent);display:flex;gap:8px;align-items:center;white-space:nowrap}
#calm-refinement .rf-chip svg.lucide{width:24px!important;height:24px!important}
#calm-refinement .rf-two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
#calm-refinement .rf-card{background:var(--rf-surface);border-radius:24px;padding:22px;min-width:0}
#calm-refinement .rf-card h3{font-size:calc(26px * var(--rf-scale));font-weight:500;margin:0 0 14px}
#calm-refinement .rf-value{font-family:RefNumbers,sans-serif;font-size:64px;font-variant-numeric:tabular-nums;line-height:1.15;margin:10px 0}
#calm-refinement .rf-value small{font-family:RefUI,sans-serif;font-size:26px}
#calm-refinement .rf-footer{position:absolute;bottom:20px;left:32px;right:32px;display:flex;align-items:center;justify-content:space-between;gap:20px;color:var(--rf-muted);font-size:22px}
#calm-refinement .rf-footer .rf-source{margin:0;line-height:1.2}
#calm-refinement .rf-footer .rf-hint{white-space:nowrap}
#calm-refinement .rf-source svg.lucide{width:24px!important;height:24px!important;display:inline-block;vertical-align:middle;margin-right:6px!important}
#calm-refinement .rf-symbol{height:48px;width:48px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--rf-focus);color:var(--rf-accent)}
#calm-refinement .rf-symbol svg.lucide{width:32px!important;height:32px!important}
#calm-refinement .rf-key{display:inline-flex;align-items:center;justify-content:center;min-width:29px;height:30px;border:1px solid var(--rf-line);border-radius:7px;font:21px RefNumbers,sans-serif;padding:0 5px;margin-right:7px;color:var(--rf-text)}
#calm-refinement .rf-rows{display:flex;flex-direction:column;gap:12px}
#calm-refinement .rf-row{display:flex;align-items:center;gap:18px;width:100%;border:2px solid transparent;border-radius:22px;padding:16px 20px;min-height:112px;background:var(--rf-surface);color:var(--rf-text);font:inherit;text-align:left}
#calm-refinement .rf-row.is-selected{background:var(--rf-focus);border-color:var(--rf-accent)}
#calm-refinement .rf-row-text{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
#calm-refinement .rf-row-text strong{font-size:calc(30px * var(--rf-scale));line-height:1.15;font-weight:600}
#calm-refinement .rf-row .rf-meta{font-size:calc(24px * var(--rf-scale))}
#calm-refinement .rf-row-value{font:calc(32px * var(--rf-scale)) RefNumbers,sans-serif;white-space:nowrap;text-align:right}
#calm-refinement .rf-row-value small{display:block;font:calc(22px * var(--rf-scale)) RefUI,sans-serif;color:var(--rf-muted);margin-top:8px}
#calm-refinement .rf-row>svg.lucide{height:24px!important;width:24px!important;color:var(--rf-muted)}

<div id="calm-refinement">
 <div class="viz-controls" aria-label="Esplora le rifiniture Apple Calm">
  <label class="form-label">Vista <select class="form-select" id="rf-view"><option value="network">Rete · grafico</option><option value="weather">Meteo · previsioni</option><option value="racing">F1 · timing</option><option value="casa">Casa · dispositivi</option><option value="account">Account · disponibilità</option><option value="menu">Menu</option><option value="icons">Icone e stati</option></select></label>
  <label class="form-label">Aspetto <select class="form-select" id="rf-palette"><option value="day">Giorno</option><option value="night">Notte</option></select></label>
  <label class="form-label">Dati <select class="form-select" id="rf-data"><option value="complete">Completi · demo</option><option value="partial">Parziali · demo</option></select></label>
  <span class="text-small text-muted">Proposta · 3,5″ orizzontale · 960 × 640 · dati demo</span>
 </div>
 <div class="viz-carousel" aria-label="Composizioni Apple Calm" data-previous-label="Precedente" data-next-label="Successiva">
  <section data-variant="Card raggruppate" aria-label="Card raggruppate"><div class="rf-app" data-layout="grouped"></div></section>
  <section data-variant="Superfici aperte" aria-label="Superfici aperte" hidden><div class="rf-app rf-open" data-layout="open"></div></section>
 </div>
 <span class="sr-only" aria-live="polite" id="rf-announcement"></span>
</div>
<script>
(() => {
 const root=document.getElementById('calm-refinement');
 const selectors={view:root.querySelector('#rf-view'),palette:root.querySelector('#rf-palette'),data:root.querySelector('#rf-data')};
 const state={view:'network',palette:'day',data:'complete',scale:1,depth:false,period:'1h',selected:0};
 const viewNames=Array.from(selectors.view.options,o=>o.value);
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const symbol=name=>`<span class="rf-symbol">${icon(name)}</span>`;
 const key=(k,label)=>`<span class="rf-key">${k}</span>${label}`;
 const dataMissing=()=>state.data==='partial';
 const footer=(text,hint='')=>`<footer class="rf-footer"><p class="rf-source">${text}</p>${hint?`<span class="rf-hint">${hint}</span>`:''}</footer>`;
 const topics={network:['Rete','wifi'],weather:['Meteo','cloud-sun'],racing:['Motorsport','flag'],casa:['Casa','house'],account:['Account','user-round'],menu:['Menu','menu'],icons:['Componenti','shapes']};
 function header(){const [name,glyph]=topics[state.view];return `<header class="rf-header">${icon(glyph)}<h2 class="rf-topic">${name}</h2><div class="rf-dots" aria-hidden="true">${'<b></b>'.repeat(8)}</div><span class="rf-time">18:42</span></header>`;}
 function network(){return `<div class="rf-main"><div class="rf-heading"><div><h2 class="rf-title">Traffico della rete</h2><p class="rf-sub">Velocità osservata · Mbit/s</p></div><div class="rf-segment" aria-label="Intervallo del grafico"><button type="button" class="cursor-interaction" data-period="1h" aria-pressed="${state.period==='1h'}">1 h</button><button type="button" class="cursor-interaction" data-period="24h" aria-pressed="${state.period==='24h'}">24 h</button></div></div><div class="rf-network-stats"><div class="rf-card">${symbol('arrow-down')}<div><span class="rf-meta">Download</span><div class="rf-value">${dataMissing()?'—':'8,6'}<small> Mbit/s</small></div></div></div><div class="rf-card">${symbol('arrow-up')}<div><span class="rf-meta">Upload</span><div class="rf-value">${dataMissing()?'—':'1,2'}<small> Mbit/s</small></div></div></div></div><div class="rf-graph" role="img" aria-label="Esempio di traffico: download linea continua, upload tratteggiato; le interruzioni indicano campioni assenti"></div><div class="rf-legend"><span><i class="rf-line-swatch"></i>Download</span><span><i class="rf-line-swatch is-upload"></i>Upload</span></div></div>${footer(dataMissing()?'Router demo · intervalli senza campioni':'Router demo · campione delle 18:40')}`;}
 function weather(){return `<div class="rf-main"><div class="rf-heading"><div><h2 class="rf-title">Angri · Salerno</h2><p class="rf-sub">Poco nuvoloso · stima attuale demo</p></div><span class="rf-chip">${icon('clock')}18:40</span></div><div class="rf-weather-main"><div class="rf-card"><div class="rf-weather-hero">${icon('cloud')}<span class="rf-value">${dataMissing()?'—':'19°'}</span></div><p class="rf-meta">${dataMissing()?'Temperatura non disponibile':'Percepita 18°'}</p></div><div class="rf-card rf-weather-lines"><span>${icon('wind')}Vento · ${dataMissing()?'—':'12 km/h'}</span><span>${icon('droplets')}Umidità · 68%</span><span>${icon('umbrella')}Prob. pioggia · 60%</span></div></div><div class="rf-forecast" aria-label="Tre previsioni giornaliere demo">${[['Oggi · 29/10',21,15,60],['Domani · 30/10',20,14,70],['Sab · 31/10',19,13,80]].map((d,i)=>`<div class="rf-card"><span class="rf-meta">${d[0]}</span>${icon(i<1?'cloud':'cloud-rain')}<strong>${dataMissing()&&i===2?'— / —':d[1]+'° / '+d[2]+'°'}</strong><span class="rf-meta">Max · Min</span><span class="rf-meta rf-rain">${dataMissing()&&i===2?'Prob. non disponibile':'Prob. max '+d[3]+'%'}</span></div>`).join('')}</div></div>${footer('Open-Meteo demo · attuale e previsioni giornaliere')}`;}
 function racing(){const pilots=[['1','Max Verstappen','VER · giro 12 / 30','1:24,580','Ultimo giro'],['2','Charles Leclerc','LEC · giro 12 / 30','+1,248','Dal leader'],['3','Lando Norris','NOR · giro 12 / 30','+3,106','Dal leader']];return `<div class="rf-main rf-racing"><div class="rf-heading"><div><h2 class="rf-title">Formula 1 · timing</h2><p class="rf-sub">Sessione registrata · esempio</p></div><span class="rf-chip">${icon('history')}Salvato</span></div><div class="rf-table-head"><span>Pos.</span><span>Pilota</span><span>Tempo / distacco</span></div><div class="rf-rows">${pilots.map((p,i)=>`<button type="button" data-select="${i}" aria-pressed="${state.selected===i}" class="rf-row cursor-interaction ${state.selected===i?'is-selected':''}"><span class="rf-position">${p[0]}</span><span class="rf-row-text"><strong>${p[1]}</strong><span class="rf-meta">${p[2]}</span></span><span class="rf-row-value">${dataMissing()&&i===1?'—':p[3]}<small>${dataMissing()&&i===1?'Non disponibile':p[4]}</small></span></button>`).join('')}</div></div>${footer('Timing demo · salvato alle 18:40',key('2 / 8','Scorri'))}`;}
 function casa(){const rows=[['thermometer','Soggiorno','Temperatura · aggiornato 18:40','21,4°','Attuale'],['lightbulb','Lampada soggiorno','Stato · aggiornato 18:39','Accesa','Attuale'],['plug','Presa studio','Ultimo dato salvato alle 18:20','Spenta','Precedente']];return `<div class="rf-main"><h2 class="rf-title">Dispositivi preferiti</h2><p class="rf-sub">Letture e stati di esempio</p><div class="rf-rows">${rows.map((r,i)=>`<button type="button" class="rf-row cursor-interaction ${state.selected===i?'is-selected':''} ${i===2?'is-old':''}" data-select="${i}" aria-pressed="${state.selected===i}">${symbol(r[0])}<span class="rf-row-text"><strong>${r[1]}</strong><span class="rf-meta">${r[2]}</span></span><span class="rf-row-value">${dataMissing()&&i===1?'—':r[3]}<small>${dataMissing()&&i===1?'Non disponibile':r[4]}</small></span></button>`).join('')}</div></div>${footer('Casa demo · letture di consultazione',key('2 / 8','Scorri'))}`;}
 function account(){return `<div class="rf-main"><div class="rf-heading"><div><h2 class="rf-title">Disponibilità salvata</h2><p class="rf-sub">Snapshot di esempio · ore 18:35</p></div><span class="rf-chip">${icon('history')}Salvato</span></div><div class="rf-two rf-usage">${[['Finestra di 5 ore',68,'Reset · 21:10'],['Settimana',42,'Reset · lunedì 09:00']].map((r,i)=>`<div class="rf-card"><h3>${r[0]}</h3><div class="rf-value">${dataMissing()&&i===1?'—':r[1]+'%'}</div><div class="rf-meta">${dataMissing()&&i===1?'Dato non disponibile':'Residuo nello snapshot'}</div>${dataMissing()&&i===1?'<div style="height:54px"></div>':`<div class="rf-track" role="progressbar" aria-label="${r[0]}: residuo salvato" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r[1]}"><i style="width:${r[1]}%"></i></div>`}<div class="rf-meta">${dataMissing()&&i===1?'Reset non disponibile':r[2]}</div></div>`).join('')}</div><p class="rf-usage-note">${icon('info')}La disponibilità attuale richiede una verifica.</p></div>${footer('Fonte account demo · nessuna sessione verificata')}`;}
 function menu(){
  const rows=[['keyboard','Comandi','Tasti e navigazione'],['settings','Impostazioni','Display, notifiche e preferenze'],['info','Informazioni','Versione, sistema e fonti'],['activity','Diagnostica','Stato e misure del dispositivo']];
  const start=state.selected===3?1:0;
  return `<div class="rf-main rf-menu"><h2 class="rf-title">Scegli una funzione</h2><p class="rf-sub">Menu della dashboard · ${start?'2–4':'1–3'} di 4</p><div class="rf-rows">${rows.slice(start,start+3).map((r,index)=>{const i=index+start;return `<button type="button" class="rf-row cursor-interaction ${state.selected===i?'is-selected':''}" data-select="${i}" aria-pressed="${state.selected===i}">${symbol(r[0])}<span class="rf-row-text"><strong>${r[1]}</strong><span class="rf-meta">${r[2]}</span></span>${icon('chevron-right')}</button>`;}).join('')}</div></div><footer class="rf-footer"><p class="rf-source">Anteprima del focus</p><button type="button" class="cursor-interaction" data-select="${start?0:3}">${key(start?2:8,start?'Prime voci':'Altre voci')}</button></footer>`;
 }
 function icons(){const icons=[['cloud-sun','Meteo','Condizione'],['trophy','Calcio','Competizione'],['flag','Motorsport','Sessione'],['wifi','Rete','Collegamento'],['house','Casa','Dispositivi'],['bell-off','Quiete','Avvisi silenziosi']];return `<div class="rf-main"><h2 class="rf-title">Icone con un significato</h2><p class="rf-sub">Tavola componenti · simboli di riferimento</p><div class="rf-icon-grid">${icons.map(r=>`<div class="rf-card">${symbol(r[0])}<div><strong>${r[1]}</strong><span class="rf-meta">${r[2]}</span></div></div>`).join('')}</div><div class="rf-state-strip"><span>${icon('check')}Aggiornato</span><span class="rf-old">${icon('history')}Precedente</span><span>${icon('circle-help')}Non disponibile</span></div></div>${footer('In produzione: atlante Apple Calm e ID semantici')}`;}
 function graph(stage){
  const el=stage.querySelector('.rf-graph');if(!el)return;
  const w=Math.max(240,Math.round(el.getBoundingClientRect().width)),h=256;
  const left=64,right=w-18,top=24,bottom=h-46;
  const down=[1.5,2.2,3.8,2.8,5.4,7.2,6.5,9.0,8.8,7.4,10.3,9.5,8.6];
  const up=[.4,.5,.7,.5,.6,.8,.9,1.1,.8,1.0,1.5,1.3,1.2];
  const missing=i=>dataMissing()&&([5,6,12].includes(i));
  const max=Math.ceil(Math.max(...down)*1.12/2)*2;
  const x=i=>left+(right-left)*i/(down.length-1),y=v=>bottom-(bottom-top)*v/max;
  function path(values){let path='',start=true;values.forEach((v,i)=>{if(missing(i)){start=true;return;}path+=(start?'M':'L')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';start=false;});return path;}
  const labels=state.period==='1h'?['17:40','18:00','18:20','18:40']:['Ieri 18:40','02:40','10:40','18:40'];
  const indexes=w<450?[0,6,12]:[0,4,8,12];
  const tickLabels=w<450?[state.period==='1h'?labels[0]:'Ieri',state.period==='1h'?'18:10':'06:40',labels[3]]:labels;
  const ticks=indexes.map((v,i)=>`<text x="${x(v)}" y="${bottom+31}" text-anchor="${i===0?'start':i===indexes.length-1?'end':'middle'}">${tickLabels[i]}</text>`).join('');
  const grid=[0,max/2,max].map(v=>`<line class="rf-tick-line" x1="${left}" x2="${right}" y1="${y(v)}" y2="${y(v)}"/><text x="${left-12}" y="${y(v)+7}" text-anchor="end">${v}</text>`).join('');
  el.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" class="rf-chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Traffico demo in Mbit/s. Download continuo, upload tratteggiato. ${dataMissing()?'Tre campioni assenti.':''}"><title>Traffico di rete dimostrativo</title>${grid}<path class="rf-data-line" d="${path(down)}"/><path class="rf-data-line rf-data-upload" d="${path(up)}"/>${ticks}</svg>`;
 }
 function render(){
  for(const k of Object.keys(selectors))selectors[k].value=state[k];
  const views={network,weather,racing,casa,account,menu,icons};
  root.querySelectorAll('.rf-app').forEach(stage=>{stage.dataset.palette=state.palette;stage.dataset.depth=state.depth;stage.style.setProperty('--rf-scale',state.scale);stage.innerHTML=header()+views[state.view]();});
  if(globalThis.lucide)lucide.createIcons({attrs:{width:24,height:24}});
  root.querySelectorAll('.rf-app').forEach(stage=>{if(stage.getBoundingClientRect().width)graph(stage);});
 }
 function save(){if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{...state},privateContent:null}).catch(()=>{});}
 function restore(saved){const s=saved&&saved.modelContent;if(!s)return;if(viewNames.includes(s.view))state.view=s.view;if(['day','night'].includes(s.palette))state.palette=s.palette;if(['complete','partial'].includes(s.data))state.data=s.data;if([1,1.1].includes(s.scale))state.scale=s.scale;if(['1h','24h'].includes(s.period))state.period=s.period;if(typeof s.depth==='boolean')state.depth=s.depth;if(Number.isInteger(s.selected)&&s.selected>=0&&s.selected<4)state.selected=s.selected;}
 restore(window.openai&&window.openai.widgetState);render();
 for(const k of Object.keys(selectors))selectors[k].addEventListener('change',()=>{state[k]=selectors[k].value;state.selected=0;render();save();root.querySelector('#rf-announcement').textContent=selectors[k].selectedOptions[0].text;});
 root.addEventListener('click',e=>{const target=e.target.closest('[data-period],[data-select]');if(!target)return;if(target.dataset.period)state.period=target.dataset.period;if(target.dataset.select!==undefined)state.selected=Number(target.dataset.select);render();save();});
 window.addEventListener('openai:set_globals',e=>{const before=JSON.stringify(state);restore(e.detail&&e.detail.globals&&e.detail.globals.widgetState);if(before!==JSON.stringify(state))render();});
 const resize=new ResizeObserver(entries=>{for(const e of entries){const stage=e.target;if(stage.getBoundingClientRect().width)graph(stage);}});root.querySelectorAll('.rf-app').forEach(stage=>resize.observe(stage));
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addSlider(state,'scale',{label:'Scala testo',min:1,max:1.1,step:.1});tweak.addToggle(state,'depth',{label:'Rilievo lieve del focus'});}
 globalThis.refinementMock={state,render,set(next){Object.assign(state,next);render();}};
})();
</script>
